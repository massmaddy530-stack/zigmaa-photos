[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Integration tests drop and re-create database tables; run them only explicitly: pytest -m integration
addopts = -m "not integration"
markers =
    integration: requires a real PostgreSQL+pgvector (TEST_DATABASE_URL) and/or Redis (TEST_REDIS_URL)
    model: requires the buffalo_l model files in FACE_MODEL_DIR
filterwarnings =
    ignore::DeprecationWarning:celery.*
